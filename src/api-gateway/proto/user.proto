syntax = "proto3";

package userpb; // Ensure this matches the generated Go package name

option go_package = "./pb/userpb"; // Updated to match the generated Go package

service UserService {
    rpc Register (RegisterRequest) returns (WebResponse); // Register method
    rpc Login (LoginRequest) returns (WebResponse); // Login method
}

message UserData {
    uint32 id = 1;
    string username = 2;
    string password = 3;
}

message RegisterResponse {
    uint32 id = 1;
    string username = 2;
}

message RegisterRequest {
    string username = 1;
    string password = 2;
}

message LoginRequest {
    string username = 1;
    string password = 2;
}

message LoginResponse {
    string token = 1;
}

message WebResponse {
    string status = 1;
    string data = 2;
}
